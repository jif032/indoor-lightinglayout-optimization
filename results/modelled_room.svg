<svg xmlns="http://www.w3.org/2000/svg" width="760" height="920" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
  <title id="title">Modeled room and initial luminaire layout</title>
  <desc id="desc">A 3.9 by 4.5 metre rectangular room with seven luminaires at the default coordinates. The task plane is 0.75 metres above the floor.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 z" fill="#475569" />
    </marker>
  </defs>
  <rect width="760" height="920" fill="#ffffff" />
  <text x="380" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Modeled task room: initial luminaire layout</text>
  <text x="380" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">Seven fixed-output luminaires · task plane z = 0.75 m · grid step = 0.25 m</text>

  <!-- Room boundary: 3.9 m × 4.5 m at 133.33 px/m. -->
  <rect x="100" y="80" width="520" height="600" fill="#f8fafc" stroke="#172033" stroke-width="4" />

  <!-- Default-config 0.5 m square luminaires; labels identify source order. -->
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#172033" stroke="#172033" stroke-width="2">
    <rect x="126.7" y="553.3" width="66.7" height="66.7" rx="4" fill="#fbbf24" /><text x="160" y="586.7" stroke="none">L1</text>
    <rect x="526.7" y="553.3" width="66.7" height="66.7" rx="4" fill="#fbbf24" /><text x="560" y="586.7" stroke="none">L2</text>
    <rect x="326.7" y="423.3" width="66.7" height="66.7" rx="4" fill="#fbbf24" /><text x="360" y="456.7" stroke="none">L3</text>
    <rect x="126.7" y="286.7" width="66.7" height="66.7" rx="4" fill="#fbbf24" /><text x="160" y="320" stroke="none">L4</text>
    <rect x="526.7" y="286.7" width="66.7" height="66.7" rx="4" fill="#fbbf24" /><text x="560" y="320" stroke="none">L5</text>
    <rect x="233.3" y="113.3" width="66.7" height="66.7" rx="4" fill="#fbbf24" /><text x="266.7" y="146.7" stroke="none">L6</text>
    <rect x="420" y="113.3" width="66.7" height="66.7" rx="4" fill="#fbbf24" /><text x="453.3" y="146.7" stroke="none">L7</text>
  </g>

  <!-- Dimension lines -->
  <line x1="100" y1="720" x2="620" y2="720" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="50" y1="80" x2="50" y2="680" stroke="#475569" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="360" y="748" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">3.9 m</text>
  <text x="31" y="380" text-anchor="middle" transform="rotate(-90 31 380)" font-family="Arial, sans-serif" font-size="17" fill="#334155">4.5 m</text>

  <text x="100" y="790" font-family="Arial, sans-serif" font-size="15" fill="#334155">Coordinates (x, y), metres:</text>
  <text x="100" y="818" font-family="Arial, sans-serif" font-size="14" fill="#334155">L1 (0.45, 0.70) · L2 (3.45, 0.70) · L3 (1.95, 1.68) · L4 (0.45, 2.70)</text>
  <text x="100" y="844" font-family="Arial, sans-serif" font-size="14" fill="#334155">L5 (3.45, 2.70) · L6 (1.25, 4.00) · L7 (2.65, 4.00)</text>
  <rect x="100" y="872" width="18" height="18" rx="3" fill="#fbbf24" stroke="#172033" stroke-width="2" />
  <text x="128" y="886" font-family="Arial, sans-serif" font-size="14" fill="#334155">0.5 m square luminaire (plan view)</text>
</svg>
