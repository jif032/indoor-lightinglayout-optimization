name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Radiance from the official LBNL release
        shell: bash
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/radiance-install"
          mkdir -p "${work_dir}/download" "${work_dir}/extract"
          asset_url="$(curl --fail --silent --show-error https://api.github.com/repos/LBNL-ETA/Radiance/releases/latest \
            | python -c 'import json,sys; release=json.load(sys.stdin); print(next(a["browser_download_url"] for a in release["assets"] if a["name"].endswith("_Linux.zip")))')"
          curl --fail --location --silent --show-error "${asset_url}" --output "${work_dir}/download/radiance.zip"
          unzip -q "${work_dir}/download/radiance.zip" -d "${work_dir}/extract"
          archive="$(find "${work_dir}/extract" -type f -name 'radiance-*-Linux.tar.gz' -print -quit)"
          test -n "${archive}"
          tar -xzf "${archive}" -C "${work_dir}/extract"
          radiance_home="$(find "${work_dir}/extract" -type d -path '*/usr/local/radiance' -print -quit)"
          test -n "${radiance_home}"
          echo "${radiance_home}/bin" >> "${GITHUB_PATH}"
          echo "RAYPATH=.:${radiance_home}/lib" >> "${GITHUB_ENV}"

      - name: Run core checks
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
